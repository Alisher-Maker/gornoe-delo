<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горный Портал</title>
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --light: #ecf0f1; --bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--light); }
        header { background: var(--dark); padding: 20px; text-align: center; border-bottom: 4px solid var(--primary); }
        nav { display: flex; justify-content: center; background: #34495e; position: sticky; top: 0; z-index: 100; }
        nav button { background: none; border: none; color: white; padding: 15px 20px; cursor: pointer; font-weight: bold; }
        nav button:hover, nav button.active { background: var(--primary); }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #2c3e50; border-radius: 10px; padding: 20px; transition: 0.3s; cursor: pointer; border: 1px solid #444; text-align: center; }
        .card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .content-block { background: white; color: #333; padding: 30px; border-radius: 15px; line-height: 1.6; }
        .hidden { display: none; }
        .option-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; background: white; font-size: 16px; }
        .option-btn:hover { border-color: var(--primary); background: #fff5eb; }
        .back-btn { background: #7f8c8d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <h1>⛏ ГОРНЫЙ ЦИФРОВОЙ КЛАСС</h1>
</header>

<nav>
    <button onclick="showSection('home')">ГЛАВНАЯ</button>
    <button onclick="showSection('lectures')">ОБУЧЕНИЕ</button>
    <button onclick="showSection('quiz-menu')">ВИКТОРИНЫ</button>
</nav>

<div class="container">
    
    <div id="section-home">
        <h2>Добро пожаловать!</h2>
        <p>Выбери раздел "Обучение" для чтения материала или "Викторины" для проверки знаний.</p>
    </div>

    <div id="section-lectures" class="hidden">
        <h2>Выберите тему лекции:</h2>
        <div class="grid">
            <div class="card" onclick="openLecture('tb')"><h3>⚠️ ТБ</h3></div>
            <div class="card" onclick="openLecture('mark')"><h3>📐 Маркшейдерия</h3></div>
            <div class="card" onclick="openLecture('bvr')"><h3>💥 Технологии БВР</h3></div>
            <div class="card" onclick="openLecture('machines')"><h3>🚜 Горные машины</h3></div>
        </div>
    </div>

    <div id="section-read-lecture" class="hidden">
        <button class="back-btn" onclick="showSection('lectures')">← Назад к списку</button>
        <div class="content-block" id="lecture-text">
            </div>
    </div>

    <div id="section-quiz-menu" class="hidden">
        <h2>Выберите тему теста:</h2>
        <div class="grid">
            <div class="card" onclick="prepQuiz('tb')"><h3>Тест по ТБ</h3></div>
            <div class="card" onclick="prepQuiz('bvr')"><h3>Тест по БВР</h3></div>
            <div class="card" onclick="prepQuiz('mark')"><h3>Тест по Маркшейдерии</h3></div>
        </div>
    </div>

    <div id="section-quiz-play" class="hidden">
        <div class="content-block">
            <div id="q-text" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;"></div>
            <div id="q-options"></div>
            <p id="q-count" style="color: #666; font-size: 14px;"></p>
        </div>
    </div>
</div>

<script>
    // МАТЕРИАЛЫ ЛЕКЦИЙ (позже заменим на твои)
    const lecturesDB = {
        tb: "<h2>Техника Безопасности</h2><p>Тут будет твой текст про ТБ...</p>",
        mark: "<h2>Маркшейдерское дело</h2><p>Тут будет твой текст про замеры...</p>",
        bvr: "<h2>Технологии БВР</h2><p>Тут будет текст про взрывчатку...</p>",
        machines: "<h2>Горные машины</h2><p>Тут будет текст про комбайны...</p>"
    };

    // БАЗА ВОПРОСОВ (Добавь по 30 штук в каждую категорию)
    const questionsDB = {
        tb: [
            { q: "Что необходимо сделать перед началом смены в шахте?", a: ["Проверить самоспасатель", "Спеть песню", "Поспать"], c: 0 },
            { q: "Основной газ, опасный в угольных шахтах?", a: ["Кислород", "Метан", "Аргон"], c: 1 }
        ],
        bvr: [
            { q: "Какой прибор используется для подрыва?", a: ["Конденсаторная подрывная машинка", "Телефон", "Динамит"], c: 0 },
            { q: "Что такое шпур?", a: ["Отверстие в породе", "Длинная шахта", "Инструмент"], c: 0 }
        ],
        mark: [
            { q: "Что измеряет теодолит?", a: ["Углы", "Вес руды", "Температуру"], c: 0 }
        ]
    };

    let currentSession = [];
    let currentIdx = 0;
    let score = 0;

    function showSection(id) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
        document.getElementById('section-' + id).classList.remove('hidden');
    }

    function openLecture(id) {
        document.getElementById('lecture-text').innerHTML = lecturesDB[id];
        showSection('read-lecture');
    }

    function prepQuiz(category) {
        let rawQuestions = questionsDB[category] || [];
        if (rawQuestions.length === 0) {
            alert("Вопросы для этой темы скоро добавятся!");
            return;
        }
        // Перемешиваем и берем до 30 (без нумерации внутри вопроса)
        currentSession = rawQuestions.sort(() => Math.random() - 0.5).slice(0, 30);
        currentIdx = 0;
        score = 0;
        showSection('quiz-play');
        displayQuestion();
    }

    function displayQuestion() {
        const qData = currentSession[currentIdx];
        document.getElementById('q-text').innerText = qData.q;
        const optDiv = document.getElementById('q-options');
        optDiv.innerHTML = '';
        
        qData.a.forEach((ans, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = ans;
            btn.onclick = () => handleAnswer(i);
            optDiv.appendChild(btn);
        });
        document.getElementById('q-count').innerText = `Вопрос ${currentIdx + 1} из ${currentSession.length}`;
    }

    function handleAnswer(selected) {
        if (selected === currentSession[currentIdx].c) score++;
        currentIdx++;
        if (currentIdx < currentSession.length) {
            displayQuestion();
        } else {
            document.getElementById('section-quiz-play').innerHTML = `
                <div class="content-block" style="text-align:center">
                    <h2>Тест завершен!</h2>
                    <p style="font-size:40px">🎯 ${score} / ${currentSession.length}</p>
                    <button class="back-btn" onclick="location.reload()">На главную</button>
                </div>
            `;
        }
    }
</script>
</body>
</html>
